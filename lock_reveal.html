<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ransomware Incident Timeline — Unlock</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{width:1280px; height:800px; overflow:hidden; background:#060B08; font-family:'IBM Plex Mono', monospace; color:#7fb89a;}
  body{
    position:relative;
    background:
      repeating-linear-gradient(180deg, rgba(47,227,138,0.035) 0px, rgba(47,227,138,0.035) 1px, transparent 1px, transparent 3px),
      radial-gradient(circle at 90% 0%, rgba(47,227,138,0.10), transparent 55%),
      radial-gradient(circle at 5% 100%, rgba(47,227,138,0.06), transparent 45%),
      #060B08;
  }

  /* ================= LOCK STAGE ================= */
  #lock-stage{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; z-index:20; transition:opacity .6s ease, visibility .6s;
  }
  #lock-stage.hide{opacity:0; visibility:hidden; pointer-events:none;}

  .lock-badge-lg{
    width:150px; height:150px; border-radius:50%;
    border:2px solid #1f5c3c; display:flex; align-items:center; justify-content:center;
    font-size:64px; position:relative; margin-bottom:34px;
    box-shadow:0 0 0 6px rgba(47,227,138,0.04), 0 0 30px rgba(47,227,138,0.15) inset;
    transition:border-color .4s ease, box-shadow .4s ease, transform .4s ease;
  }
  .lock-badge-lg.unlocked{
    border-color:#2fe38a;
    box-shadow:0 0 0 10px rgba(47,227,138,0.08), 0 0 55px rgba(47,227,138,0.55);
    transform:scale(1.08);
    animation:unlockPop .5s ease;
  }
  @keyframes unlockPop{
    0%{transform:scale(1);}
    40%{transform:scale(1.18);}
    100%{transform:scale(1.08);}
  }
  .lock-badge-lg .ring{
    position:absolute; inset:-14px; border-radius:50%; border:1px dashed rgba(47,227,138,0.25);
    animation:spin 6s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .lock-status{font-size:14px; letter-spacing:2px; color:#d4ffe8; text-transform:uppercase; margin-bottom:18px; font-weight:600;}
  .lock-status.granted{color:#2fe38a; text-shadow:0 0 12px rgba(47,227,138,.7);}

  .progress-track{width:340px; height:6px; background:#122018; border-radius:4px; overflow:hidden; margin-bottom:16px; border:1px solid #1f5c3c;}
  .progress-fill{height:100%; width:0%; background:linear-gradient(90deg,#1f5c3c,#2fe38a); border-radius:4px; transition:width 2.2s cubic-bezier(.4,0,.2,1);}

  .lock-sub{font-size:11px; color:#4f9c78; opacity:.85; margin-bottom:34px;}

  .trust-btn{
    font-family:'IBM Plex Mono', monospace; font-size:14px; letter-spacing:3px; font-weight:700;
    color:#2fe38a; background:rgba(47,227,138,0.06); border:1.5px solid #2fe38a; border-radius:30px;
    padding:14px 40px; cursor:pointer; text-transform:uppercase;
    box-shadow:0 0 18px rgba(47,227,138,.25);
    opacity:0; transform:translateY(10px); pointer-events:none;
    transition:opacity .5s ease, transform .5s ease, background .2s, box-shadow .2s;
  }
  .trust-btn.show{opacity:1; transform:translateY(0); pointer-events:auto;}
  .trust-btn:hover{background:rgba(47,227,138,0.16); box-shadow:0 0 28px rgba(47,227,138,.5);}
  .trust-btn .curs{display:inline-block; width:7px; height:12px; background:#2fe38a; margin-left:8px;
    box-shadow:0 0 6px rgba(47,227,138,.9); animation:cursorBlink 1s step-end infinite; vertical-align:middle;}
  @keyframes cursorBlink{0%,49%{opacity:1;} 50%,100%{opacity:0;}}

  /* ================= DASHBOARD STAGE (real screenshot) ================= */
  #dashboard-stage{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    opacity:0; transform:scale(.94); transition:opacity .6s ease, transform .6s ease;
  }
  #dashboard-stage.show{opacity:1; transform:scale(1);}
  .real-frame{
    width:1160px; border-radius:10px; overflow:hidden; border:1px solid #1f5c3c;
    box-shadow:0 0 0 1px rgba(47,227,138,.15), 0 0 60px rgba(47,227,138,.15);
    background:#0A120D;
  }
  .real-topbar{
    display:flex; align-items:center; gap:12px; padding:10px 18px; border-bottom:1px solid #1f5c3c;
    background:#060B08;
  }
  .real-topbar .dots{letter-spacing:6px; font-size:10px; color:#1f5c3c;}
  .real-topbar .prompt{font-size:11px; color:#4f9c78;}
  .real-img{display:block; width:100%; height:auto;}
</style>
</head>

<script>
  const progressFill = document.getElementById('progressFill');
  const lockBadge = document.getElementById('lockBadge');
  const lockIcon = document.getElementById('lockIcon');
  const lockStatus = document.getElementById('lockStatus');
  const trustBtn = document.getElementById('trustBtn');
  const lockStage = document.getElementById('lock-stage');
  const dashStage = document.getElementById('dashboard-stage');

  // auto-unlock sequence
  requestAnimationFrame(()=>{ progressFill.style.width = '100%'; });

  setTimeout(()=>{
    lockIcon.textContent = '🔓';
    lockBadge.classList.add('unlocked');
    lockStatus.textContent = 'ACCESS GRANTED';
    lockStatus.classList.add('granted');
  }, 2300);

  setTimeout(()=>{
    trustBtn.classList.add('show');
  }, 2800);

  trustBtn.addEventListener('click', ()=>{
    lockStage.classList.add('hide');
    dashStage.classList.add('show');
  });

  // expose a hook for automated (video) triggering
  window.__triggerReveal = ()=>{ trustBtn.click(); };
</script>
